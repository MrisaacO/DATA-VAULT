{% extends "base.html" %}
{% block title %}Move folder — Personal Data Vault{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h5 mb-3">Move "{{ folder.name }}"</h1>
                <form method="post">
                    {% csrf_token %}
                    {% for error in form.non_field_errors %}
                        <div class="alert alert-danger">{{ error }}</div>
                    {% endfor %}
                    <div class="mb-3">
                        <label class="form-label">Destination</label>
                        {{ form.destination }}
                    </div>
                    <button type="submit" class="btn btn-primary">Move</button>
                    <a class="btn btn-outline-secondary" href="{% url 'folders:detail' folder.pk %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
