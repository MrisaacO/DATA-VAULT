{% extends "base.html" %}
{% block title %}Delete permanently — Personal Data Vault{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h5 mb-3 text-danger">Permanently delete "{{ folder.name }}"?</h1>
                <p class="text-muted">This cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Delete permanently</button>
                    <a class="btn btn-outline-secondary" href="{% url 'storage_app:recycle_bin' %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
