{% extends "base.html" %}
{% block title %}Delete note — Personal Data Vault{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h5 mb-3">Move "{{ note.title }}" to the recycle bin?</h1>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Move to recycle bin</button>
                    <a class="btn btn-outline-secondary" href="{% url 'notes:detail' note.pk %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
