{% extends "base.html" %}
{% block title %}{{ note.title }} — Personal Data Vault{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h4 mb-0">
                <i class="bi bi-journal-text"></i> {{ note.title }}
                {% if note.is_favourite %}<i class="bi bi-star-fill text-warning"></i>{% endif %}
            </h1>
            <div class="btn-group btn-group-sm">
                <a class="btn btn-outline-secondary" href="{% url 'notes:edit' note.pk %}">Edit</a>
                <form method="post" action="{% url 'notes:toggle_favourite' note.pk %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-secondary">
                        {% if note.is_favourite %}Unfavourite{% else %}Favourite{% endif %}
                    </button>
                </form>
                <a class="btn btn-outline-danger" href="{% url 'notes:delete' note.pk %}">Delete</a>
            </div>
        </div>
        <p class="text-muted small">Last updated {{ note.updated_at|date:"N j, Y, g:i a" }}</p>
        <div class="card">
            <div class="card-body" style="white-space: pre-wrap;">{{ note.content }}</div>
        </div>
    </div>
</div>
{% endblock %}
